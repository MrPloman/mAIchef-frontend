<div class="auth-page">
  <!-- ── Form panel ── -->
  <app-deco-aside></app-deco-aside>
  <main class="auth-form-panel">
    <div class="auth-form-wrap">
      <!-- Mobile brand -->
      <div class="auth-mobile-brand">
        <span class="brand-icon">🍴</span>
        <span class="brand-name">RecetApp</span>
      </div>

      <div class="auth-heading">
        <p class="auth-eyebrow">Bienvenido de nuevo</p>
        <h2>Inicia sesión</h2>
        <p>Continúa descubriendo recetas increíbles.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                viewBox="0 0 24 24"
              >
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="M2 7l10 7 10-7" />
              </svg>
            </span>
            <input
              id="email"
              type="email"
              class="form-input"
              formControlName="email"
              placeholder="chef@recetapp.com"
              [ngClass]="{ 'is-invalid': email.invalid && email.touched }"
              autocomplete="email"
            />
          </div>
          <p class="form-error" *ngIf="email.invalid && email.touched">
            <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <path fill="white" d="M12 7v6M12 17h.01" />
            </svg>
            <ng-container *ngIf="email.errors?.['required']"
              >El correo es obligatorio.</ng-container
            >
            <ng-container *ngIf="email.errors?.['email']"
              >Introduce un correo válido.</ng-container
            >
          </p>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                viewBox="0 0 24 24"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
            </span>
            <input
              id="password"
              [type]="showPwd() ? 'text' : 'password'"
              class="form-input"
              formControlName="password"
              placeholder="••••••••"
              [ngClass]="{ 'is-invalid': password.invalid && password.touched }"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="btn-eye"
              (click)="togglePwd()"
              [attr.aria-label]="
                showPwd() ? 'Ocultar contraseña' : 'Mostrar contraseña'
              "
            >
              <svg
                *ngIf="!showPwd()"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                viewBox="0 0 24 24"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg
                *ngIf="showPwd()"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                viewBox="0 0 24 24"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"
                />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <p class="form-error" *ngIf="password.invalid && password.touched">
            <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <path fill="white" d="M12 7v6M12 17h.01" />
            </svg>
            <ng-container *ngIf="password.errors?.['required']"
              >La contraseña es obligatoria.</ng-container
            >
            <ng-container *ngIf="password.errors?.['minlength']"
              >Mínimo 8 caracteres.</ng-container
            >
          </p>
        </div>

        <!-- Remember me / Forgot password -->
        <div class="form-row">
          <div class="checkbox-group">
            <input
              type="checkbox"
              id="rememberMe"
              formControlName="rememberMe"
            />
            <label for="rememberMe">Recordarme</label>
          </div>
          <a routerLink="/auth/recovery-password" class="link-primary"
            >¿Olvidaste tu contraseña?</a
          >
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary" [disabled]="isLoading()">
          <span class="spinner" *ngIf="isLoading()"></span>
          <span *ngIf="!isLoading()">Entrar a RecetApp</span>
          <span *ngIf="isLoading()">Entrando…</span>
        </button>

        <div class="divider">o continúa con</div>

        <!-- Google OAuth placeholder -->
        <button type="button" class="btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          Continuar con Google
        </button>
      </form>

      <p class="auth-footer">
        ¿Nuevo en RecetApp?
        <a routerLink="/auth/register">Crear cuenta gratis</a>
      </p>
    </div>
  </main>
</div>
